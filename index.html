<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitBooth</title>
<meta name="description" content="BitBooth builds AI-powered products for investment teams.">
<style>
  :root {
    --bg: #fafaf9;
    --ink: #1c1917;
    --soft: #57534e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161514; --ink: #f5f5f4; --soft: #a8a29e; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  p { margin-top: 1rem; font-size: clamp(1.05rem, 2.5vw, 1.3rem); color: var(--soft); text-wrap: balance; }
</style>
</head>
<body>
<main>
  <h1>BitBooth</h1>
  <p>Building AI-powered products for investment teams.</p>
</main>
</body>
</html>
