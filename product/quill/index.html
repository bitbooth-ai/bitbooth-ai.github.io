<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill · Clipboard to Markdown</title>
<meta name="description" content="Convert rich text to Markdown entirely on the browser.">
<script>
  try {
    const theme = localStorage.getItem('quill:theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  } catch {}
</script>
<link rel="modulepreload" href="convert.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #15253E;
    --silver: #F9F7F8;
    --light-blue: #99D0F2;
    --purple: #7B68DF;
    --bg: var(--silver);
    --ink: var(--navy);
    --soft: #56627A;
    --line: #DCD8E2;
    --panel: #FFFFFF;
    --accent: var(--purple);
    --accent-text: var(--purple);
    --focus: #7B68DF59;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--navy);
      --ink: var(--silver);
      --soft: #A9B6CB;
      --line: #2C3E5C;
      --panel: #1C2E4C;
      --accent-text: var(--light-blue);
      --focus: #99D0F266;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--navy);
    --ink: var(--silver);
    --soft: #A9B6CB;
    --line: #2C3E5C;
    --panel: #1C2E4C;
    --accent-text: var(--light-blue);
    --focus: #99D0F266;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 Figtree, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 4vw, 40px);
    gap: 16px;
  }
  header, main { width: 100%; max-width: 64rem; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font: 700 30px/1 "Playfair Display", Georgia, serif; }
  h1 span { color: var(--accent-text); }
  header p { flex: 1; color: var(--soft); }
  main { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status { flex: 1; min-width: 12rem; color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  .status b { color: var(--ink); font-weight: 600; }
  button {
    font: 600 14px/1.5 Figtree, Arial, sans-serif;
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  #theme { align-self: center; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; }
  #theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .moon, :root[data-theme="dark"] .sun { display: none; }
  :root[data-theme="dark"] .moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sun { display: none; }
    :root:not([data-theme="light"]) .moon { display: block; }
  }
  textarea {
    flex: 1;
    min-height: 60vh;
    width: 100%;
    resize: none;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    font: 14px/1.6 ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
    tab-size: 4;
  }
  textarea::placeholder { color: var(--soft); opacity: 1; }
  textarea { --thumb: color-mix(in srgb, var(--ink) 22%, transparent); }
  textarea::-webkit-scrollbar { width: 14px; height: 14px; background: transparent; }
  textarea::-webkit-scrollbar-track, textarea::-webkit-scrollbar-corner { background: transparent; }
  textarea::-webkit-scrollbar-thumb {
    background: var(--thumb);
    background-clip: padding-box;
    border: 4px solid transparent;
    border-radius: 7px;
    min-height: 40px;
  }
  textarea::-webkit-scrollbar-thumb:hover { --thumb: var(--accent-text); }
  textarea::-webkit-scrollbar-thumb:active { --thumb: var(--accent); }
  @supports not selector(::-webkit-scrollbar) {
    textarea { scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; }
  }
  textarea.on-scrollbar, body.scrolling, body.scrolling textarea { cursor: default; }
  body.flash textarea { border-color: var(--accent); }
  kbd {
    font: 600 12px/1 ui-monospace, Consolas, monospace;
    padding: 2px 5px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: var(--panel);
    color: var(--ink);
  }
</style>
</head>
<body>
<header>
  <h1>quill<span>.</span></h1>
  <p>Convert rich text to Markdown entirely on the browser.</p>
  <button type="button" id="theme" aria-label="Switch theme" title="Switch theme">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<main>
  <div class="bar">
    <div class="status" id="status" role="status" aria-live="polite">Paste anywhere with <kbd>Ctrl</kbd> <kbd>V</kbd></div>
    <button type="button" id="clear" disabled>Clear</button>
    <button type="button" id="copy" class="primary" disabled>Copy</button>
  </div>
  <textarea id="output" spellcheck="false" aria-label="Markdown output" placeholder="Copy something from Word, Outlook, Google Docs, Excel, VS Code or a web page, then paste it here.

Output is CommonMark with GitHub tables and strikethrough."></textarea>
</main>
<script type="module">
import { htmlToMarkdown, textToMarkdown, detectSource } from './convert.js';

const root = document.documentElement;
const output = document.getElementById('output');
const status = document.getElementById('status');
const copyButton = document.getElementById('copy');
const clearButton = document.getElementById('clear');
const IDLE = 'Paste anywhere with <kbd>Ctrl</kbd> <kbd>V</kbd>';

document.getElementById('theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('quill:theme', root.dataset.theme); } catch {}
});

function editorLanguage(data) {
  const raw = data.getData('vscode-editor-data');
  if (!raw) return '';
  try { return JSON.parse(raw).mode || ''; } catch { return ''; }
}

function syncButtons() {
  const empty = output.value === '';
  copyButton.disabled = empty;
  clearButton.disabled = empty;
}

async function copy() {
  try {
    await navigator.clipboard.writeText(output.value);
  } catch {
    output.select();
    if (!document.execCommand('copy')) return false;
  }
  return true;
}

function flash() {
  document.body.classList.add('flash');
  setTimeout(() => document.body.classList.remove('flash'), 400);
}

document.addEventListener('paste', e => {
  const data = e.clipboardData;
  if (!data) return;
  const html = data.getData('text/html');
  const text = data.getData('text/plain');
  if (!html && !text) return;
  e.preventDefault();

  const start = performance.now();
  const markdown = html ? htmlToMarkdown(html, { language: editorLanguage(data) }) : textToMarkdown(text);
  const ms = performance.now() - start;
  const source = html ? detectSource(html) : 'Plain text';

  if (e.target === output && document.activeElement === output && output.value !== '') {
    output.setRangeText(markdown.replace(/\n$/, ''), output.selectionStart, output.selectionEnd, 'end');
  } else {
    output.value = markdown;
    output.scrollTop = 0;
  }
  syncButtons();
  flash();

  const kb = (html || text).length / 1024;
  status.innerHTML = `<b>${source}</b> · ${kb < 10 ? kb.toFixed(1) : Math.round(kb)} KB in ${ms < 10 ? ms.toFixed(1) : Math.round(ms)} ms`;
});

copyButton.addEventListener('click', async () => {
  const ok = await copy();
  copyButton.textContent = ok ? 'Copied' : 'Copy failed';
  setTimeout(() => { copyButton.textContent = 'Copy'; }, 1200);
});

clearButton.addEventListener('click', () => {
  output.value = '';
  syncButtons();
  status.innerHTML = IDLE;
  output.focus();
});

output.addEventListener('input', syncButtons);

// Chrome shows the I-beam over custom scrollbars, so switch to the arrow there and while dragging.
function onScrollbar(e) {
  return e.offsetX >= output.clientLeft + output.clientWidth || e.offsetY >= output.clientTop + output.clientHeight;
}
output.addEventListener('pointermove', e => output.classList.toggle('on-scrollbar', onScrollbar(e)));
output.addEventListener('pointerleave', () => output.classList.remove('on-scrollbar'));
output.addEventListener('pointerdown', e => { if (onScrollbar(e)) document.body.classList.add('scrolling'); });
document.addEventListener('pointerup', () => document.body.classList.remove('scrolling'));
document.addEventListener('pointermove', e => { if (!e.buttons) document.body.classList.remove('scrolling'); });
</script>
</body>
</html>
