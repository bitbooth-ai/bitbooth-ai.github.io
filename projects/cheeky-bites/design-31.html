<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheeky Bite — The Cake Stand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{--cream:#FFF7EE;--ink:#4A3A38;--pink:#E8798F;--gold:#C9A25A}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:'Fraunces',serif;overflow-x:hidden}
  #stage{position:fixed;inset:0;touch-action:pan-y;cursor:grab}
  #stage.grabbing{cursor:grabbing}
  .spacer{height:520vh;pointer-events:none}
  .mark{position:fixed;top:1.4rem;left:0;right:0;text-align:center;z-index:5;pointer-events:none;
    font-size:clamp(1.3rem,4vw,1.8rem);font-weight:600;letter-spacing:.04em}
  .mark em{color:var(--pink)}
  .hint{position:fixed;bottom:1.6rem;left:0;right:0;text-align:center;z-index:5;pointer-events:none;
    font-style:italic;font-size:.95rem;opacity:.65;transition:opacity .6s}
  .hint.hide{opacity:0}
  /* final CTA */
  .cta{position:fixed;inset:0;display:grid;place-items:center;z-index:6;opacity:0;pointer-events:none;
    transition:opacity .8s ease}
  .cta.show{opacity:1;pointer-events:auto}
  .cta button{border:none;cursor:pointer;background:var(--ink);color:var(--cream);
    font-family:'Fraunces',serif;font-size:clamp(1.1rem,3.5vw,1.5rem);font-style:italic;
    padding:1.1rem 2.6rem;border-radius:999px;box-shadow:0 20px 46px -18px rgba(74,58,56,.55);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s}
  .cta button:hover{transform:scale(1.06);background:var(--pink)}
  /* order dialog */
  dialog{border:none;border-radius:1.2rem;padding:2.2rem 2rem;max-width:22rem;width:calc(100vw - 2.4rem);
    background:#FFFDF8;color:var(--ink);box-shadow:0 30px 80px -30px rgba(74,58,56,.6)}
  dialog::backdrop{background:rgba(74,58,56,.35);backdrop-filter:blur(3px)}
  dialog h2{font-weight:600;font-size:1.4rem;margin-bottom:.3rem}
  dialog p{font-style:italic;font-size:.92rem;opacity:.75;margin-bottom:1.2rem}
  .f{margin-bottom:1.1rem}
  .f label{display:block;font-family:system-ui,sans-serif;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;opacity:.6;margin-bottom:.3rem}
  .f label .req{color:var(--pink)}
  .f input,.f textarea{width:100%;border:none;border-bottom:1px solid rgba(74,58,56,.3);background:transparent;
    font-family:'Fraunces',serif;font-size:1.1rem;padding:.3rem 0;color:var(--ink);border-radius:0}
  .f input:focus,.f textarea:focus{outline:none;border-bottom-color:var(--pink)}
  .row{display:flex;gap:.7rem;margin-top:1.4rem}
  .row button{flex:1;border:none;cursor:pointer;border-radius:999px;padding:.85rem;
    font-family:'Fraunces',serif;font-size:.95rem}
  .row .ok{background:var(--ink);color:var(--cream)}
  .row .ok:hover{background:var(--pink)}
  .row .no{background:transparent;color:var(--ink);border:1px solid rgba(74,58,56,.3)}
  .thanks{display:none;text-align:center;font-style:italic;font-size:1.15rem;padding:.6rem 0;color:var(--pink)}
  .thanks.show{display:block}
  .fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:2rem;z-index:4}
  .fallback.show{display:grid}
</style>
</head>
<body>

<canvas id="stage" aria-label="A rotating three-tier cake stand of bakery photographs"></canvas>
<div class="spacer" aria-hidden="true"></div>

<p class="mark">Cheeky <em>Bite</em></p>
<p class="hint" id="hint">scroll · spin · taste with your eyes</p>

<div class="cta" id="cta">
  <button id="openOrder">call me back ↺</button>
</div>

<div class="fallback" id="fallback"><p style="font-style:italic">This piece needs WebGL —
  please try a newer browser, or visit any other Cheeky Bite design.</p></div>

<dialog id="orderDlg">
  <form id="orderForm" method="dialog" novalidate>
    <h2>Sweet — let's talk.</h2>
    <p>Leave your details; the baker calls you back.</p>
    <div class="f"><label for="c-name">Name</label><input id="c-name" type="text" autocomplete="name"></div>
    <div class="f"><label for="c-email">Email <span class="req">*</span></label><input id="c-email" type="email" autocomplete="email"></div>
    <div class="f"><label for="c-phone">Phone <span class="req">*</span></label><input id="c-phone" type="tel" autocomplete="tel"></div>
    <div class="f"><label for="c-msg">Occasion (optional)</label><textarea id="c-msg" rows="2"></textarea></div>
    <p class="thanks" id="thanks">Noted — you'll hear the phone ring soon. ♥</p>
    <div class="row" id="btnRow">
      <button type="button" class="no" id="closeDlg">not yet</button>
      <button type="submit" class="ok">call me</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  'use strict';
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('stage');

  if(!window.THREE){ document.getElementById('fallback').classList.add('show'); return; }
  var renderer;
  try{
    renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  }catch(e){ document.getElementById('fallback').classList.add('show'); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding = THREE.sRGBEncoding;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFFF7EE);
  scene.fog = new THREE.Fog(0xFFF7EE, 10, 26);

  var camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 100);
  camera.position.set(0, 5.3, 9.5);

  scene.add(new THREE.AmbientLight(0xffffff, .95));
  var dir = new THREE.DirectionalLight(0xfff2df, .5);
  dir.position.set(4, 8, 6); scene.add(dir);

  // central column + finial
  var goldMat = new THREE.MeshLambertMaterial({color:0xC9A25A});
  var column = new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,11.4,20), goldMat);
  column.position.y = 0; scene.add(column);
  var finial = new THREE.Mesh(new THREE.SphereGeometry(.3,24,18), goldMat);
  finial.position.y = 5.9; scene.add(finial);

  // tiers
  var TIERS = [
    { y: 4,  plate:0xF7C8D8, dirn: 1,  imgs:['images/1780894899980.jpg','images/1782399388868.jpg','images/1782399389268.jpg','images/1783770350417.jpg'] },
    { y: 0,  plate:0xF7E1A8, dirn:-1,  imgs:['images/1782399389414.jpg','images/1782399389465.jpg','images/1782399389340.jpg'] },
    { y:-4,  plate:0xCFE8D8, dirn: 1,  imgs:['images/229617.jpg','images/229618.jpg','images/229626.jpg','images/229625.jpg','images/229619.jpg'] }
  ];
  var loader = new THREE.TextureLoader();
  var tierGroups = [];
  var photoMeshes = [];

  TIERS.forEach(function(t){
    var g = new THREE.Group();
    g.position.y = t.y;
    g.userData.speed = .0022 * t.dirn;
    g.userData.vel = 0;
    var plate = new THREE.Mesh(
      new THREE.CylinderGeometry(3.1, 3.25, .22, 56),
      new THREE.MeshLambertMaterial({color:t.plate}));
    plate.position.y = 0; g.add(plate);
    var rim = new THREE.Mesh(new THREE.TorusGeometry(3.18,.045,12,72), goldMat);
    rim.rotation.x = Math.PI/2; rim.position.y = .12; g.add(rim);

    t.imgs.forEach(function(url, i){
      var a = (i / t.imgs.length) * Math.PI * 2;
      var mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1,1),
        new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide}));
      mesh.position.set(Math.cos(a)*3.55, 1.35, Math.sin(a)*3.55);
      mesh.rotation.y = Math.PI/2 - a;
      mesh.scale.set(1.9,1.9,1);
      mesh.userData.isPhoto = true;
      loader.load(url, function(tex){
        tex.encoding = THREE.sRGBEncoding;
        var asp = tex.image.width / tex.image.height;
        mesh.scale.set(1.9*Math.min(asp,1.4), 1.9, 1);
        mesh.material.map = tex; mesh.material.needsUpdate = true;
      });
      g.add(mesh); photoMeshes.push(mesh);
    });
    scene.add(g); tierGroups.push(g);
  });

  // scroll → camera
  var scrollP = 0;
  function readScroll(){
    var max = document.documentElement.scrollHeight - innerHeight;
    scrollP = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  }
  addEventListener('scroll', readScroll, {passive:true});
  readScroll();

  // drag to spin + tap to focus
  var raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  var dragging = false, moved = 0, lastX = 0;
  var focus = null; // {mesh, parent, origPos, origRot, releasing}

  function activeTier(){
    var best = tierGroups[0], bd = 1e9;
    tierGroups.forEach(function(g){
      var d = Math.abs(g.position.y - camLookY);
      if(d < bd){ bd = d; best = g; }
    });
    return best;
  }
  canvas.addEventListener('pointerdown', function(e){
    dragging = true; moved = 0; lastX = e.clientX;
    canvas.classList.add('grabbing');
  });
  addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
    var g = activeTier();
    g.rotation.y += dx * .006;
    g.userData.vel = dx * .006;
  });
  addEventListener('pointerup', function(e){
    canvas.classList.remove('grabbing');
    if(dragging && moved < 6) handleTap(e);
    dragging = false;
  });

  function handleTap(e){
    if(focus && !focus.releasing){ release(); return; }
    pointer.x = (e.clientX/innerWidth)*2 - 1;
    pointer.y = -(e.clientY/innerHeight)*2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(photoMeshes);
    if(hits.length){
      var m = hits[0].object;
      focus = { mesh:m, parent:m.parent,
        origPos:m.position.clone(), origRot:m.rotation.clone(), releasing:false };
      scene.attach(m);
    }
  }
  function release(){
    if(!focus) return;
    focus.releasing = true;
    focus.parent.attach(focus.mesh);
  }

  // CTA + hint
  var cta = document.getElementById('cta'), hint = document.getElementById('hint');

  // render loop
  var camLookY = 4.75, clock = new THREE.Clock();
  function frame(){
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), .05);

    // camera path — look target tracks the visual center of each tier
    // (plate at tier.y, photo ring centered at tier.y + 1.35 → ensemble center ≈ tier.y + 0.75)
    var targetLook= 4.75 + scrollP * (-8);    // 4.75 (tier 1) → -3.25 (tier 3)
    var targetY   = targetLook + .55;         // constant gentle downward angle
    var k = reduced ? 1 : .08;
    camera.position.y += (targetY - camera.position.y) * k;
    camLookY += (targetLook - camLookY) * k;
    // dolly out on narrow (portrait) screens so the ring isn't cropped
    var zBase = camera.aspect < 1 ? 9.5 + (1 - camera.aspect) * 3.5 : 9.5;
    camera.position.z = zBase - Math.sin(scrollP*Math.PI) * 1.2;
    camera.lookAt(0, camLookY, 0);

    // tier rotation + inertia
    tierGroups.forEach(function(g){
      if(!(focus && !focus.releasing)){
        if(!reduced) g.rotation.y += g.userData.speed;
        g.rotation.y += g.userData.vel;
        g.userData.vel *= .94;
      }
    });
    finial.rotation.y += reduced ? 0 : .01;

    // focus tween
    if(focus){
      var m = focus.mesh, sp = reduced ? 1 : .12;
      if(!focus.releasing){
        var fwd = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
        var dst = camera.position.clone().add(fwd.multiplyScalar(3.1));
        m.position.lerp(dst, sp);
        var q = new THREE.Quaternion();
        var mm = new THREE.Matrix4().lookAt(camera.position, m.position, new THREE.Vector3(0,1,0));
        q.setFromRotationMatrix(mm);
        m.quaternion.slerp(q, sp);
      }else{
        m.position.lerp(focus.origPos, sp);
        var qr = new THREE.Quaternion().setFromEuler(focus.origRot);
        m.quaternion.slerp(qr, sp);
        if(m.position.distanceTo(focus.origPos) < .02){
          m.position.copy(focus.origPos); m.quaternion.copy(qr); focus = null;
        }
      }
    }

    // UI states
    if(scrollP > .9){ cta.classList.add('show'); } else { cta.classList.remove('show'); }
    if(scrollP > .04){ hint.classList.add('hide'); }

    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }
  frame();

  // order dialog
  var dlg = document.getElementById('orderDlg');
  document.getElementById('openOrder').addEventListener('click', function(){ dlg.showModal(); });
  document.getElementById('closeDlg').addEventListener('click', function(){ dlg.close(); });
  document.getElementById('orderForm').addEventListener('submit', function(e){
    var em = document.getElementById('c-email'), ph = document.getElementById('c-phone');
    if(!em.value.trim() || !ph.value.trim()){ e.preventDefault(); (em.value?ph:em).focus(); return; }
    e.preventDefault();
    document.getElementById('btnRow').style.display = 'none';
    document.getElementById('thanks').classList.add('show');
    setTimeout(function(){ dlg.close(); }, 2200);
  });
})();
</script>
</body>
</html>
